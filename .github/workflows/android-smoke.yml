name: Android smoke build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Android build dependencies
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 10m sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: android
        run: timeout --signal=TERM --kill-after=30s 20m gradle :app:assembleDebug --stacktrace

      - name: Verify 16KB APK ZIP alignment
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          timeout --signal=TERM --kill-after=10s 2m \
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -v -c -P 16 4 "$APK"

      - name: Verify ELF LOAD alignment
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d "$TMP"
          READELF="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$READELF"
          for so in "$TMP"/lib/arm64-v8a/*.so; do
            echo "== $so =="
            LOADS=$("$READELF" -lW "$so" | awk '$1 == "LOAD" {print $NF}')
            test -n "$LOADS"
            echo "$LOADS"
            while IFS= read -r align; do
              test "$align" = "0x4000" || {
                echo "ERROR: LOAD segment alignment is $align, expected 0x4000: $so"
                exit 1
              }
            done <<< "$LOADS"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saintsrm-smoke-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
